<!doctype html><html lang="en"><meta charset="utf-8"><title>Hybrid performance screen</title>
<style>body{font:18px system-ui;background:#111;color:#eee;margin:24px}#surface{width:960px;height:540px;background:#000}video,canvas{width:960px;height:540px;object-fit:contain}</style>
<p id="progress">Preparing comparison…</p><input type="file" id="file" hidden><div id="surface"></div>
<script type="module">
import {Player} from './generated/index.js';
window.start=async (mode,options={})=>{window.errors=[];window.player=new Player(document.querySelector('#surface'),{mode,width:options.width??1920,height:options.height??1080});player.addEventListener('error',e=>errors.push(e.detail));if(options.videoFilters)await player.setVideoFilters(options.videoFilters);if(options.audioFilters)await player.setAudioFilters(options.audioFilters);await player.open(document.querySelector('#file').files[0]);if(options.subtitle)await player.selectTrack('sub',options.subtitle);await player.play();};
window.snapshot=()=>{const diagnostics=player.diagnostics,live=player.current?.backend?.trackPresenter;if(live){const quality=live.video.getVideoPlaybackQuality();diagnostics.backend={...diagnostics.backend,trackOutput:{...live.stats,delays:[...live.stats.delays],total:quality.totalVideoFrames,dropped:quality.droppedVideoFrames,width:live.video.videoWidth,height:live.video.videoHeight}};}return {mode:player.mode,position:player.properties.get('time-pos'),quality:{frameDrops:player.properties.get('frame-drop-count'),decoderDrops:player.properties.get('decoder-frame-drop-count'),avsync:player.properties.get('avsync')},diagnostics,audio:player.audioDiagnostics(),errors};};
window.progress=({trial,total,label,seconds,remaining})=>{const until=performance.now()+seconds*1000;clearInterval(window.progressTimer);const paint=()=>{const left=Math.max(0,Math.ceil((until-performance.now())/1000));document.querySelector('#progress').textContent=`${trial}/${total}: ${label}. ${left}s left in phase; approximately ${remaining+left}s remaining overall. Headless development screen; not foreground qualification.`;};paint();window.progressTimer=setInterval(paint,500);};
</script></html>
