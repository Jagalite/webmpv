<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>webmpv</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#111719;color:#e4ece7}body{max-width:960px;margin:40px auto;padding:0 24px}h1{margin:0}p,small{color:#a3b4ab}button,select,input{font:inherit;padding:8px;border:1px solid #42594b;border-radius:6px;background:#273a30;color:inherit}button:disabled,input:disabled{opacity:.45}nav,form,.settings{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;align-items:center}#surface video,#surface canvas{width:100%;aspect-ratio:16/9;object-fit:contain}#surface{background:#000;border-radius:10px;overflow:hidden}input[type=url]{flex:1;min-width:220px}pre{white-space:pre-wrap;font-size:12px}#timeline{width:80%}label{display:inline-flex;gap:8px;align-items:center}#status{min-height:24px}
</style>
<h1>webmpv</h1>
<p>Choose how your video plays.</p>
<nav><label>Playback <select id="mode"><option value="native">Native</option><option value="hybrid">Hybrid</option><option value="software">Software</option></select></label><input id="file" type="file" aria-label="Open media file"><button id="demo">Play example</button></nav>
<p id="mode-help">Browser playback and browser-supported subtitles.</p>
<form id="remote"><input id="url" type="url" placeholder="Media URL" aria-label="Media URL" required><button>Open URL</button></form>
<div id="surface"></div>
<nav><button id="play">Play</button><button id="pause">Pause</button><button id="close">Close</button><label>Volume <input id="volume" type="range" min="0" max="100" value="100"></label><label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select></label></nav>
<label>Position <input id="timeline" type="range" min="0" max="1" step="0.1" value="0"></label><span id="time">0:00</span>
<div class="settings"><label>Audio <select id="audio"><option value="auto">Auto</option></select></label><label>Subtitles <select id="subs"><option value="auto">Auto</option><option value="no">Off</option></select></label><label>Load WebVTT <input id="text-track" type="file" accept=".vtt"></label></div>
<form id="filters"><label>Video filters <input id="vf" placeholder="hflip,eq=brightness=0.1"></label><label>Audio filters <input id="af" placeholder="volume=0.5"></label><button id="apply-filters">Apply</button><button id="clear-filters" type="button">Clear filters</button></form>
<small id="filter-help">Select Software to use video or audio filters.</small>
<p id="status" role="status">Ready.</p>
<details><summary>Diagnostics</summary><pre id="diagnostics"></pre></details>
<script type="module">
import {Player} from '/web/generated/index.js';
const $=id=>document.getElementById(id);let player;const trackURLs=[];
window.playerErrors=[];
const help={native:'Browser playback and browser-supported subtitles.',hybrid:'Browser video decoding with mpv timing and subtitles. Supported H.264 sources only.',software:'FFmpeg software decoding, mpv subtitles, and video/audio filters. Local files up to 32 MiB.'};
function controls(){const mode=player.mode;$('mode').value=mode;$('mode-help').textContent=help[mode];for(const id of ['vf','af','apply-filters','clear-filters'])$(id).disabled=mode!=='software';$('text-track').disabled=mode!=='native';$('filter-help').textContent=mode==='software'?'Changing filters reopens at the current position. Clear filters before choosing another mode.':'Select Software to use video or audio filters.';}
function create(mode=$('mode').value){player=window.player=new Player($('surface'),{mode});player.addEventListener('error',e=>{window.playerErrors.push(e.detail);$('status').textContent=e.detail;});player.addEventListener('modechange',e=>{$('status').textContent=e.detail.phase==='loading'?'Opening…':e.detail.phase==='failed'?e.detail.message:'Ready.';controls();});player.addEventListener('mpv',e=>{const p=e.detail;if(p.event!=='property-change')return;if(p.name==='track-list')for(const [type,id] of [['audio','audio'],['sub','subs']]){const selected=$(id).value;$(id).replaceChildren(new Option('Auto','auto'));if(type==='sub')$(id).add(new Option('Off','no'));for(const t of p.data||[])if(t.type===type)$(id).add(new Option(t.title||t.lang||`${type} ${t.id}`,t.id,false,!!t.selected));if(selected==='no')$(id).value='no';}if(p.name==='duration')$('timeline').max=p.data||1;if(p.name==='time-pos'){$('timeline').value=p.data||0;$('time').textContent=`${Math.floor((p.data||0)/60)}:${String(Math.floor((p.data||0)%60)).padStart(2,'0')}`;}});controls();return player;}
async function run(action){try{await action();}catch(error){$('status').textContent=error.message;controls();}}
function releaseTracks(){for(const url of trackURLs)URL.revokeObjectURL(url);trackURLs.length=0;}
create();
$('mode').onchange=e=>{const mode=e.target.value;run(()=>player.setMode(mode));};
$('file').onchange=e=>{const file=e.target.files[0];if(file)run(async()=>{await player.open(file);releaseTracks();await player.play();$('status').textContent=file.name;});};
$('demo').onclick=()=>run(async()=>{const bytes=await(await fetch('/fixtures/example.mp4')).arrayBuffer();await player.open(bytes);releaseTracks();await player.play();});
$('remote').onsubmit=e=>{e.preventDefault();run(async()=>{await player.openRemote({url:$('url').value});releaseTracks();await player.play();});};
$('play').onclick=()=>run(()=>player.play());$('pause').onclick=()=>run(()=>player.pause());
$('close').onclick=()=>run(async()=>{const mode=player.mode;await player.destroy();releaseTracks();create(mode);$('vf').value='';$('af').value='';$('file').value='';$('text-track').value='';$('volume').value='100';$('speed').value='1';$('timeline').value='0';$('timeline').max='1';$('time').textContent='0:00';$('audio').replaceChildren(new Option('Auto','auto'));$('subs').replaceChildren(new Option('Auto','auto'),new Option('Off','no'));$('status').textContent='Closed.';});
$('volume').oninput=e=>run(()=>player.volume(Number(e.target.value)));$('speed').onchange=e=>run(()=>player.rate(Number(e.target.value)));$('timeline').onchange=e=>run(()=>player.seek(Number(e.target.value)));
$('audio').onchange=e=>run(()=>player.selectTrack('audio',e.target.value));$('subs').onchange=e=>run(()=>player.selectTrack('sub',e.target.value));
$('text-track').onchange=e=>{const file=e.target.files[0];if(file)run(async()=>{const src=URL.createObjectURL(file);try{await player.addTextTrack({src,label:file.name});trackURLs.push(src);}catch(error){URL.revokeObjectURL(src);throw error;}});};
$('filters').onsubmit=e=>{e.preventDefault();run(async()=>{await player.setVideoFilters($('vf').value);await player.setAudioFilters($('af').value);});};
$('clear-filters').onclick=()=>run(async()=>{await player.setVideoFilters('');await player.setAudioFilters('');$('vf').value='';$('af').value='';});
const timer=setInterval(()=>$('diagnostics').textContent=JSON.stringify(player.diagnostics,null,2),500);
window.addEventListener('pagehide',()=>{clearInterval(timer);void player.destroy();releaseTracks();},{once:true});
</script></html>
